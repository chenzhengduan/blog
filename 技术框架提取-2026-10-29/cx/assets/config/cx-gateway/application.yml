# cx-gateway 本地配置。
#
# 技术栈与配置结构参考 reference-projects/xzagent-gateway 的 application.yml 改写：
#   - 保留 spring.application.name / profiles / server.port / management / nacos / log 段。
#   - 路由规则不在本文件，而在 application-template.yml（配到 Nacos 动态生效），与
#     xzagent-gateway 模式一致（discovery.locator.enabled: false，路由显式配置）。
#   - 凭证/密钥一律走环境变量或 Nacos 配置，不入源码（宪法原则 IV）。

spring:
  application:
    # 网关在 Nacos 的注册名
    name: cx-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      discovery:
        locator:
          # 关闭基于服务名的自动路由，路由规则显式配置在 Nacos cx-gateway.yml
          # （见 application-template.yml），避免未预期暴露（与 xzagent-gateway 一致）
          enabled: false

server:
  # 网关端口（参考 xzagent-gateway 的 9511）
  port: ${SERVER_PORT:9511}

management:
  endpoints:
    web:
      exposure:
        # 暴露健康检查与信息端点（网关自身存活探针）
        include: health,info

# Nacos 配置：使用原生 nacos-client 1.4.x，兼容 Nacos 1.3.x/1.4.x HTTP 协议（与
# xzagent-gateway 一致）。网关以 lb://cx-backend 经 Nacos 寻址后端业务服务。
nacos:
  # Nacos 服务器地址，格式 host:port，多节点用逗号分隔
  server-addr: ${NACOS_SERVER_ADDR:https://service.example.com}
  # 命名空间 ID（非命名空间名称），为空则使用 public 空间
  namespace: ${NACOS_NAMESPACE:}
  # 分组，与后端 cx-backend 同 namespace/group，便于服务发现
  group: ${NACOS_GROUP:DEFAULT_GROUP}
  # Nacos 账号；原生 nacos-client 需由代码显式传入 Properties
  username: ${NACOS_USERNAME:nacos}
  # Nacos 密码；仅配置环境变量不会自动生效，必须由注册/配置中心客户端显式读取
  password: ${NACOS_PASSWORD:}
  # 是否开启服务注册
  register-enabled: ${NACOS_REGISTER_ENABLED:true}
  # 是否开启配置中心；从 Nacos 加载 cx-gateway.yml（含路由配置）
  config-enabled: ${NACOS_CONFIG_ENABLED:true}

# 日志开关默认配置，可被 Nacos cx-gateway.yml 覆盖
# 控制台与阿里云 SLS 双 appender 由 logback-spring.xml 按开关控制（宪法原则 V）
log:
  console:
    enable: true   # 默认开启控制台输出
  level: INFO      # 默认日志级别
