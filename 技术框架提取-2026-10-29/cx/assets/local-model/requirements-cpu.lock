##
## cx-py CPU 全量精确锁定依赖文件。
##
## 生成方式：
##   python -m pip install --no-index --find-links https://mirrors.aliyun.com/pytorch-wheels/cpu \
##       torch==2.4.1+cpu torchvision==0.19.1+cpu
##   python -m pip install -e ".[dev]" opencv-python-headless
##   python -m pip uninstall opencv-python -y   # 移除 GUI 版，只保留 headless
##   python -m pip check
##   python -m pip freeze --all > requirements-cpu.lock
##
## PyTorch CPU wheel 来源：https://mirrors.aliyun.com/pytorch-wheels/cpu；普通 PyPI 源不提供
## torch==2.4.1+cpu 这类带本地版本后缀的 CPU wheel，Dockerfile 必须先用 --no-deps
## + --find-links 从阿里云 PyTorch wheel 列表安装 torch/torchvision，再让普通依赖继续走
## 默认阿里云 PyPI 源。
## OpenCV 只保留 opencv-python-headless，禁止同时安装 GUI 版本。
## 哈希校验由 CI 在安装阶段执行（pip install --require-hashes）。
##

